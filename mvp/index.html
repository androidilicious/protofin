<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Protofin Backtest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Five sections (Overview, Approaches, Experiments, Signal Value-Added, Methodology). Colour carries two meanings only:
   which approach (blue, teal, violet; amber for the Committee variant) and status (green passed,
   amber waiting, grey planned, red blocked, slate paused; magenta demo). Text always accompanies colour. */
:root {
  --bg: #0b1020; --surface: #111a2e; --surface-2: #0e1628; --surface-3: #18233a;
  --border: #243150; --border-strong: #34425f;
  --text: #e8ecf5; --text-2: #b4bdd1; --muted: #8590a8;
  --accent: #6aa0ff; --accent-soft: rgba(106,160,255,.14);
  --pos: #4ade80; --neg: #f87171; --warn: #fbbf24; --slate: #9aa6bd; --demo: #f0abfc; --demo-soft: rgba(240,171,252,.12);
  --c-det: #5b96ff; --c-com: #f472b6; --c-jev: #22d3ee; --c-rag: #b79cff; --c-bench: #8590a8; --c-common: #e2e8f2;
  --a-eq: #e2e8f0; --a-gov: #8b97ad; --a-credit: #3f4a66;
  --font: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
  --shadow: 0 10px 30px rgba(0,0,0,.28);
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f4f6fa; --surface: #ffffff; --surface-2: #f6f8fc; --surface-3: #edf1f7;
    --border: #dfe4ee; --border-strong: #c7d0de;
    --text: #0f172a; --text-2: #3b465c; --muted: #5f6a80;
    --accent: #2563eb; --accent-soft: rgba(37,99,235,.09);
    --pos: #16a34a; --neg: #b91c1c; --warn: #b45309; --slate: #64748b; --demo: #a21caf; --demo-soft: rgba(162,28,175,.07);
    --c-det: #2563eb; --c-com: #db2777; --c-jev: #0891b2; --c-rag: #7c3aed; --c-bench: #8b94a7; --c-common: #1e293b;
    --a-eq: #1e293b; --a-gov: #64748b; --a-credit: #cbd5e1;
    --shadow: 0 6px 20px rgba(15,23,42,.06);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f4f6fa; --surface: #ffffff; --surface-2: #f6f8fc; --surface-3: #edf1f7;
  --border: #dfe4ee; --border-strong: #c7d0de;
  --text: #0f172a; --text-2: #3b465c; --muted: #5f6a80;
  --accent: #2563eb; --accent-soft: rgba(37,99,235,.09);
  --pos: #16a34a; --neg: #b91c1c; --warn: #b45309; --slate: #64748b; --demo: #a21caf; --demo-soft: rgba(162,28,175,.07);
  --c-det: #2563eb; --c-com: #db2777; --c-jev: #0891b2; --c-rag: #7c3aed; --c-bench: #8b94a7; --c-common: #1e293b;
  --a-eq: #1e293b; --a-gov: #64748b; --a-credit: #cbd5e1;
  --shadow: 0 6px 20px rgba(15,23,42,.06);
  color-scheme: light;
}
:root[data-theme="dark"] { color-scheme: dark; }

* { box-sizing: border-box; }
html, body { margin: 0; }
html { scroll-padding-top: 130px; }
body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
a { color: var(--accent); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
svg.i { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

.wrap { max-width: 1160px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* header and tabs */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--border); }
.top .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 24px; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; font-weight: 700; font-size: 16px; letter-spacing: -.01em; }
.brand .logo { display: inline-flex; gap: 3px; }
.brand .logo i { width: 6px; height: 18px; border-radius: 2px; }
header nav { display: flex; flex-wrap: wrap; gap: 4px; margin-left: auto; min-width: 0; justify-content: flex-end; }
header nav a { text-decoration: none; color: var(--text-2); padding: 7px 12px; border-radius: 999px; font-size: 14px; font-weight: 500; text-align: center; white-space: nowrap; }
header nav a:hover { background: var(--surface-3); color: var(--text); }
header nav a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }

main .wrap { padding-block: 26px 56px; display: grid; gap: 22px; }
section { display: grid; gap: 14px; min-width: 0; }
h1 { font-size: clamp(24px, 3.1vw, 32px); line-height: 1.15; letter-spacing: -.02em; margin: 0; text-wrap: balance; }
h2 { font-size: 17px; letter-spacing: -.01em; margin: 0; text-wrap: balance; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
h3 { font-size: 14.5px; margin: 0; display: flex; align-items: center; gap: 6px; }
.lede { color: var(--text-2); font-size: 16px; max-width: 64ch; margin: 0; }
.sub { color: var(--muted); font-size: 13px; margin: 0; }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 18px; box-shadow: var(--shadow); min-width: 0; display: grid; gap: 12px; align-content: start; }
.phead { display: flex; justify-content: space-between; align-items: center; gap: 8px 12px; flex-wrap: wrap; }
.num { font-variant-numeric: tabular-nums; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 16px; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 16px; }

/* chips: data status and implementation status */
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 8px; border-radius: 999px; font-size: 12.5px; font-weight: 600; white-space: nowrap;
        border: 1px solid var(--border); background: var(--surface-2); color: var(--text-2); }
.chip svg.i { width: 14px; height: 14px; }
.chip.dev { color: var(--accent); border-color: transparent; background: var(--accent-soft); }
.chip.sealed { color: var(--warn); }
.chip.na { color: var(--muted); border-style: dashed; background: transparent; }
.chip.demo { color: var(--demo); background: var(--demo-soft); border-color: transparent; }
.chip.ok { color: var(--pos); } .chip.wait { color: var(--warn); } .chip.plan { color: var(--muted); border-style: dashed; background: transparent; }
.chip.block { color: var(--neg); } .chip.pause { color: var(--slate); }
.chip.explor { color: var(--warn); background: color-mix(in srgb, var(--warn) 12%, transparent); border-color: color-mix(in srgb, var(--warn) 40%, transparent); }
.chip.frozen { color: var(--text-2); } .chip.approval { color: var(--warn); } .chip.design { color: var(--muted); border-style: dashed; background: transparent; }
.chip.plain { font-weight: 500; white-space: normal; max-width: 100%; }
.ahead, .ahead .chips { min-width: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.badge { width: 24px; height: 24px; border-radius: 8px; display: inline-grid; place-items: center; font-weight: 700; font-size: 13px; color: var(--bg); flex: none; }

/* tooltips */
.tip { position: relative; display: inline-flex; vertical-align: middle; }
.tip > button { width: 17px; height: 17px; border-radius: 50%; border: 1px solid var(--border-strong); background: transparent; color: var(--muted);
                font: 600 10.5px/1 var(--font); cursor: help; display: inline-grid; place-items: center; padding: 0; }
.tip > button:hover, .tip.open > button { color: var(--accent); border-color: var(--accent); }
.tip > span { position: fixed; left: 0; top: 0; width: max-content; max-width: min(280px, calc(100vw - 32px));
              background: var(--surface-3); color: var(--text); border: 1px solid var(--border-strong); border-radius: 10px; padding: 8px 10px;
              font: 400 13px/1.45 var(--font); box-shadow: var(--shadow); z-index: 40; display: none; pointer-events: none; text-align: left;
              letter-spacing: 0; text-transform: none; white-space: normal; }
.tip.show > span { display: block; }
.nw { white-space: nowrap; }

/* phase strip */
.phases { display: grid; gap: 8px; }
.pbar { display: flex; gap: 4px; min-width: 0; }
.pseg { position: relative; border-radius: 10px; padding: 9px 10px 11px; min-width: 0; display: grid; gap: 1px; align-content: center; text-decoration: none; color: var(--text); overflow: hidden; }
.pseg b { font-size: 13px; display: flex; align-items: center; gap: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pseg small { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pseg .short { display: none; }
.pseg.live { min-width: 52px; }
.tri-list { display: none; list-style: none; margin: 0; padding: 0; gap: 8px; }
.tri-list li { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; align-items: center; background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; font-size: 13.5px; }
.tri-list li.pending { border-style: dashed; background: transparent; color: var(--muted); }
.tri-list .pair { display: inline-flex; align-items: center; gap: 4px; }
.tri-list .pair .badge { width: 20px; height: 20px; font-size: 11.5px; border-radius: 6px; }
.tri-list b { font-variant-numeric: tabular-nums; }
.tri-list small { grid-column: 2; color: var(--muted); font-size: 12px; }
.cmpwrap.phone { display: none; }
.plist { display: none; list-style: none; margin: 0; padding: 0; gap: 6px; }
.plist li { display: grid; grid-template-columns: 12px 1fr auto; gap: 10px; align-items: center; font-size: 13.5px; color: var(--text-2); }
.plist li i { width: 12px; height: 12px; border-radius: 4px; }
.plist li b { color: var(--text); font-weight: 600; }
.plist li small { color: var(--muted); font-size: 12.5px; text-align: right; }
.pseg.train { background: var(--surface-3); }
.pseg.dev { background: var(--accent-soft); box-shadow: inset 0 0 0 1.5px var(--accent); }
.pseg.test { background: repeating-linear-gradient(135deg, var(--surface-2) 0 7px, var(--surface-3) 7px 14px); box-shadow: inset 0 0 0 1.5px var(--warn); }
.pseg.test b svg { color: var(--warn); }
.pseg.live { background: transparent; box-shadow: inset 0 0 0 1.5px var(--border-strong); }
.pseg .overlap { position: absolute; left: 0; bottom: 0; height: 5px; background: var(--warn); opacity: .55; border-radius: 0 0 0 10px; }
.paxis { display: flex; gap: 4px; font-size: 11.5px; color: var(--muted); }
.paxis span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.paxis span { min-width: 0; }
.olegend { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); }
.olegend i { width: 22px; height: 5px; border-radius: 3px; background: var(--warn); opacity: .55; }
.cmp { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.cmp th, .cmp td { padding: 7px 6px; border-bottom: 1px solid var(--border); text-align: right; white-space: nowrap; }
.cmp th:first-child, .cmp td:first-child { text-align: left; }
.cmp thead th { font-size: 12px; color: var(--muted); font-weight: 600; white-space: normal; vertical-align: bottom; }
.cmpwrap { overflow-x: auto; min-width: 0; }
.cmp tr.primary td { font-weight: 650; }
.cmp tbody tr:last-child td { border-bottom: 0; }

/* verdict banner */
.verdict { display: grid; grid-template-columns: 40px 1fr; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--text-2);
           border-radius: 14px; padding: 12px 16px; }
.verdict .ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--surface-3); color: var(--text); }
.verdict b { font-size: 17px; display: block; letter-spacing: -.01em; }
.verdict span { color: var(--text-2); font-size: 13.5px; }
.ilegend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; color: var(--text-2); }
.ilegend > span { display: inline-flex; align-items: center; gap: 5px; }
.ilegend svg.i { width: 15px; height: 15px; }
.ilegend .ok { color: var(--pos); } .ilegend .wait { color: var(--warn); } .ilegend .plan { color: var(--muted); } .ilegend .block { color: var(--neg); } .ilegend .pause { color: var(--slate); }
.ilegend .sw { width: 12px; height: 8px; border-radius: 2px; display: inline-block; }
.nsig { justify-self: start; display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; color: var(--text-2); background: var(--surface-3); border-radius: 999px; padding: 2px 8px; }

/* approach cards */
.acard { position: relative; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 16px; display: grid; gap: 12px; align-content: start;
         box-shadow: var(--shadow); min-width: 0; border-top: 3px solid var(--c); transition: border-color .15s, transform .15s; }
.acard:hover, .acard:focus-within { border-color: var(--border-strong); border-top-color: var(--c); transform: translateY(-1px); }
.acard .t { display: flex; align-items: center; gap: 10px; font-weight: 650; font-size: 15.5px; line-height: 1.25; }
.acard .t a { color: inherit; text-decoration: none; }
.acard .t a::after { content: ""; position: absolute; inset: 0; border-radius: 16px; }
.acard .tip, .acard .chip { position: relative; z-index: 2; }
.acard p { margin: 0; color: var(--text-2); font-size: 13.5px; }
.mini-flow { display: flex; align-items: center; gap: 4px; color: var(--muted); }
.mini-flow .n { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; background: var(--surface-2); border: 1px solid var(--border); color: var(--text-2); }
.mini-flow .n.agent { border-color: var(--c); color: var(--c); }
.mini-flow .ar { width: 10px; height: 1.5px; background: var(--border-strong); }
.big { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.big .v { font-size: 28px; font-weight: 700; letter-spacing: -.02em; line-height: 1; }
.big .l { color: var(--muted); font-size: 12.5px; display: inline-flex; align-items: center; gap: 4px; }
.vsrow { display: grid; gap: 6px; font-size: 13px; color: var(--text-2); }
.unavail { display: grid; gap: 10px; background: var(--surface-2); border: 1px dashed var(--border-strong); border-radius: 12px; padding: 12px; font-size: 13px; color: var(--text-2); }
.prog { height: 8px; border-radius: 4px; background: var(--surface-3); overflow: hidden; display: flex; }
.prog i { display: block; height: 100%; }
.go { color: var(--accent); font-weight: 600; font-size: 13px; text-decoration: none; }

/* confidence-interval bar */
.ci { display: grid; gap: 4px; }
.cibar { position: relative; height: 22px; background: var(--surface-2); border-radius: 7px; }
.cibar .zero { position: absolute; top: 3px; bottom: 3px; width: 2px; background: var(--border-strong); }
.cibar .range { position: absolute; top: 8px; height: 6px; border-radius: 3px; opacity: .45; }
.cibar .pt { position: absolute; top: 5px; width: 12px; height: 12px; border-radius: 50%; transform: translateX(-50%); border: 2px solid var(--surface); }
.cilabels { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--muted); gap: 6px; }

/* primary-comparison diagram */
.tri { width: 100%; max-width: 560px; justify-self: center; height: auto; overflow: visible; }
.tri .edge { stroke-width: 2.5; }
.tri .edge.pending { stroke: var(--border-strong); stroke-dasharray: 6 5; }
.tri .edge.done { stroke: var(--text-2); }
.tri .lbl rect { fill: var(--surface); stroke: var(--border-strong); }
.tri .lbl text { fill: var(--text); font: 600 14px var(--font); }
.tri .lbl text.s { fill: var(--muted); font: 500 12.5px var(--font); }
.tri .node circle { stroke: var(--surface); stroke-width: 3; }
.tri .node text { font: 700 15px var(--font); fill: var(--bg); }
.tri .node text.n { fill: var(--text); font: 600 14.5px var(--font); }
.tri-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; color: var(--muted); justify-content: center; }
.tri-legend > span { display: inline-flex; align-items: center; gap: 6px; }
.tri-legend i { width: 22px; height: 0; border-top: 2.5px solid var(--text-2); }
.tri-legend i.p { border-top: 2.5px dashed var(--border-strong); }

/* findings */
.facts { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.facts li { display: grid; grid-template-columns: 22px 1fr; gap: 8px; font-size: 14px; color: var(--text-2); align-items: start; }
.facts li svg { margin-top: 1px; }
.facts.ok svg { color: var(--pos); } .facts.wait svg { color: var(--warn); }

/* charts */
.chartbox { position: relative; height: 300px; min-width: 0; }
.chartbox.sm { height: 220px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px; }
.legend button { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); background: var(--surface-2); border-radius: 999px;
                 padding: 3px 10px; font-size: 12.5px; cursor: pointer; color: var(--text-2); }
.legend button[aria-pressed="false"] { opacity: .45; }
.legend .ln { width: 14px; height: 0; border-top: 3px solid; border-radius: 2px; }
.legend .ln.dash { border-top-style: dashed; border-top-width: 2px; width: 20px; border-radius: 0; }
.legend .ln.dot { border-radius: 0; }
.legend .ln.dot { border-top-style: dotted; border-top-width: 3px; }
.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--border); border-radius: 999px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 5px 12px; border-radius: 999px; font-size: 13px; cursor: pointer; color: var(--text-2); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.18); font-weight: 600; }

/* explore links */
.explore { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 12px; }
.explore a { display: grid; grid-template-columns: 36px 1fr; gap: 10px; align-items: center; text-decoration: none; color: var(--text); background: var(--surface);
             border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; }
.explore a:hover { border-color: var(--border-strong); }
.explore a .ic { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.explore a b { font-size: 14px; display: block; }
.explore a span { font-size: 12.5px; color: var(--muted); }

/* approach tabs */
.atabs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.atabs a { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text-2); background: var(--surface); border: 1px solid var(--border);
           border-radius: 12px; padding: 10px 12px; font-weight: 600; font-size: 14px; min-width: 0; }
.atabs a span.t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.atabs a[aria-current="page"] { color: var(--text); border-color: var(--c); box-shadow: inset 0 -3px 0 var(--c); }
.ahead { display: grid; gap: 10px; }
.ahead .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.back { font-size: 13.5px; text-decoration: none; color: var(--muted); }
.back:hover { color: var(--text); }

/* flow diagrams */
.flowd { display: grid; gap: 12px; }
.fnodes { display: flex; align-items: stretch; gap: 0; overflow-x: auto; padding: 4px 2px 6px; }
.fnode { flex: 1 1 0; min-width: 104px; display: grid; justify-items: center; gap: 6px; text-align: center; border: 1.5px solid var(--border); background: var(--surface-2);
         border-radius: 14px; padding: 12px 8px; cursor: pointer; color: var(--text-2); font-size: 13px; font-weight: 600; line-height: 1.25; }
.fnode .ic { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; background: var(--surface-3); color: var(--text-2); }
.fnode .ic svg.i { width: 20px; height: 20px; }
.fnode .k { font-size: 10.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.fnode.agent .ic { background: var(--c); color: var(--bg); }
.fnode.store .ic { box-shadow: inset 0 0 0 1.5px var(--c); color: var(--c); background: transparent; }
.fnode.tool .ic { box-shadow: inset 0 0 0 1.5px var(--border-strong); background: transparent; }
.fnode.alloc .ic, .fnode.output .ic { background: var(--accent-soft); color: var(--accent); }
.fnode:hover { border-color: var(--border-strong); color: var(--text); }
.fnode[aria-pressed="true"] { border-color: var(--c); color: var(--text); background: var(--surface); box-shadow: 0 0 0 3px var(--accent-soft); }
.farrow { flex: none; width: 22px; display: grid; place-items: center; color: var(--muted); pointer-events: none; }
.fdetail { background: var(--surface-2); border-left: 3px solid var(--c); border-radius: 10px; padding: 10px 12px; font-size: 14px; color: var(--text-2); min-height: 44px; }
.fdetail b { color: var(--text); }
.fkinds { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); }
.fkinds > span { display: inline-flex; align-items: center; gap: 6px; }
.fkinds i { width: 12px; height: 12px; border-radius: 4px; background: var(--surface-3); }
.fkinds i.agent { background: var(--c); } .fkinds i.store { box-shadow: inset 0 0 0 1.5px var(--c); background: transparent; }
.fkinds i.tool { box-shadow: inset 0 0 0 1.5px var(--border-strong); background: transparent; } .fkinds i.out { background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }

/* KPI tiles on detail pages */
.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.kpi { background: var(--surface-2); border-radius: 10px; padding: 9px 11px; min-width: 0; }
.kpi .v { font: 650 18px/1.2 var(--font); font-variant-numeric: tabular-nums; }
.kpi .l { color: var(--muted); font-size: 12px; display: flex; align-items: center; gap: 4px; }
.kpi.primary { box-shadow: inset 0 0 0 1px var(--accent); }
.kpis.k4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
#d-alike h3 { margin-top: 4px; color: var(--text); }
.svcard { border: 1px solid var(--border); border-top: 3px solid var(--c); border-radius: 12px; padding: 14px; display: grid; gap: 10px; min-width: 0; align-content: start; }
.svgap { display: grid; gap: 10px; padding-top: 4px; }
#signal-value { display: grid; gap: 14px; }
#signal-value .arow { grid-template-columns: minmax(0, 210px) minmax(0, 1fr) 84px; }
#signal-value .cmp th[scope=row] { white-space: normal; text-align: left; font-weight: 500; color: var(--text-2); }
@media (max-width: 560px) { #signal-value .arow { grid-template-columns: minmax(0, 1fr) 70px; } #signal-value .kpi .v { font-size: 15px; white-space: nowrap; } #signal-value .kpi { padding: 8px 9px; } }

/* validation tracker (Causal RAG) */
.track-steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.track-steps li { display: grid; grid-template-columns: 26px 1fr auto; gap: 10px; align-items: center; font-size: 14px; color: var(--text-2); }
.track-steps li .dot { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); border: 1px solid var(--border); }
.track-steps li.pass .dot { color: var(--pos); } .track-steps li.blocked .dot { color: var(--neg); } .track-steps li.pending .dot { color: var(--muted); border-style: dashed; }
.track-steps li.review .dot { color: var(--warn); }
.track-steps li small { display: block; color: var(--muted); font-size: 12px; }

/* Causal RAG versions */
.vcards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 14px; }
.vcard { border: 1px solid var(--border); border-radius: 14px; padding: 14px; background: var(--surface-2); display: flex; flex-direction: column; gap: 10px; }
.vcard > div:last-child { margin-top: auto; }
.vtop { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
.vtop b { font-size: 15.5px; }
.vlbl { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.vcard ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.vcard li { display: grid; grid-template-columns: 18px 1fr; gap: 8px; align-items: start; font-size: 13.5px; color: var(--text-2); }
.vcard li .i { width: 18px; height: 18px; }
.vcard .ev li .i { color: var(--c-rag); }
.vchecks { border-top: 1px solid var(--border); padding-top: 10px !important; }
.vchecks li.done .i { color: var(--pos); }
.vchecks li.todo { color: var(--muted); }

/* experiments tree */
.legend-st { display: flex; flex-wrap: wrap; gap: 6px; }
.tree { display: grid; grid-template-columns: minmax(0, 220px) minmax(0, 1fr); gap: 0 26px; align-items: center; }
.tree .base { border: 1.5px solid var(--c); border-radius: 14px; padding: 14px; display: grid; gap: 8px; justify-items: start; background: var(--surface-2); position: relative; }
.tree .base::after { content: ""; position: absolute; right: -27px; top: 50%; width: 26px; border-top: 1.5px solid var(--border-strong); }
.tree .base b { font-size: 14px; }
.branches { display: grid; gap: 8px; position: relative; padding-left: 14px; border-left: 1.5px solid var(--border-strong); }
.branch { position: relative; background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; }
.branch::before { content: ""; position: absolute; left: -15px; top: 22px; width: 14px; border-top: 1.5px solid var(--border-strong); }
.branch.planned, .branch.paused { border-style: dashed; background: transparent; }
.exres { display: grid; gap: 9px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 11px 12px; }
.exres-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.exres-h b { font-size: 14px; color: var(--text); }
.exres-rows { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 190px), 1fr)); gap: 8px 16px; margin: 0; }
.exres-rows > div { display: grid; gap: 1px; min-width: 0; }
.exres-rows dt { color: var(--muted); font-size: 12px; }
.exres-rows dd { margin: 0; font: 650 16px/1.2 var(--font); color: var(--text); font-variant-numeric: tabular-nums; }
.exres-rows small { color: var(--muted); font-size: 11.5px; }
.exres p { margin: 0; font-size: 13px; color: var(--text-2); }
.exres-caution { display: grid !important; grid-template-columns: 18px 1fr; gap: 7px; align-items: start; border-left: 3px solid var(--warn); background: var(--surface-2); border-radius: 8px; padding: 8px 10px; }
.exres-caution svg.i { width: 15px; height: 15px; color: var(--warn); margin-top: 1px; }

/* exploratory Causal RAG: never styled like a validated result */
.xpanel { border: 1.5px dashed var(--warn); background: repeating-linear-gradient(135deg, transparent 0 12px, var(--surface-2) 12px 13px), var(--surface); }
.xhead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.xtag { display: inline-flex; align-items: center; gap: 6px; background: var(--warn); color: var(--bg); border-radius: 8px;
  padding: 4px 10px; font-size: 12px; font-weight: 700; letter-spacing: .02em; }
.xtag svg.i { width: 15px; height: 15px; }
.xgates { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 13px; color: var(--text-2); }
.xgates b { color: var(--text); }
.xprog { display: grid; gap: 6px; }
.xbar { height: 10px; background: var(--surface-2); border-radius: 5px; overflow: hidden; }
.xbar span { display: block; height: 100%; background: var(--warn); opacity: .7; }
.xpanel .kpi .v { font-size: 20px; }
.branch > button { all: unset; box-sizing: border-box; width: 100%; display: flex; align-items: center; gap: 8px; padding: 10px 12px; cursor: pointer; font-weight: 600; font-size: 14px; }
.branch > button:focus-visible { outline: 2px solid var(--accent); border-radius: 12px; }
.branch > button .nm { flex: 1; min-width: 0; }
.branch > button svg.chev { color: var(--muted); transition: transform .15s; }
.branch > button[aria-expanded="true"] svg.chev { transform: rotate(90deg); }
.branch .bd { padding: 0 12px 12px; font-size: 13.5px; color: var(--text-2); display: grid; gap: 8px; }
.branch .bd[hidden] { display: none; }

/* methodology */
.settings { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr)); gap: 10px; }
.setting { display: grid; grid-template-columns: 36px 1fr; gap: 10px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 12px; align-items: stretch; }
.setting > div { display: flex; flex-direction: column; align-items: flex-start; }
.setting > div .chip { margin-top: auto; }
.setting .ic { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: var(--surface-2); color: var(--text-2); }
.setting b { font-size: 13.5px; display: flex; align-items: center; gap: 6px; }
.setting p { margin: 2px 0 6px; font-size: 13px; color: var(--text-2); }
.matrix { display: grid; grid-template-columns: minmax(0, 1fr) repeat(4, 96px); align-items: stretch; font-size: 13.5px; }
.matrix .cell { display: grid; place-items: center; }
.matrix .gate { display: flex; align-items: center; }
.matrix > div { padding: 8px 6px; border-bottom: 1px solid var(--border); min-width: 0; }
.matrix .mh { font-size: 12px; color: var(--muted); font-weight: 600; text-align: center; display: grid; justify-items: center; align-content: end; gap: 3px; border-bottom-color: var(--border-strong); }
.matrix .mh:first-child { text-align: left; justify-items: start; }
.phone-key { display: none; }
.matrix .gate { color: var(--text-2); }
.matrix .cell { text-align: center; }
.matrix .cell .tip > button { width: 26px; height: 26px; border: 0; background: transparent; cursor: help; font-size: 0; }
.matrix .cell .tip > button svg.i { width: 18px; height: 18px; }
.matrix .cell.pass button { color: var(--pos); } .matrix .cell.review button { color: var(--warn); } .matrix .cell.pending button { color: var(--muted); }
.matrix .cell.blocked button { color: var(--neg); } .matrix .cell.na { color: var(--border-strong); }
.callout { display: grid; grid-template-columns: 22px 1fr; gap: 8px; background: var(--surface-2); border: 1px solid var(--border); border-left: 3px solid var(--warn); border-radius: 10px; padding: 10px 12px; font-size: 13.5px; color: var(--text-2); }
.callout svg { color: var(--warn); margin-top: 1px; }
.callout ul { margin: 4px 0 0; padding-left: 18px; display: grid; gap: 4px; }
details.more { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 0 16px; }
details.more summary { cursor: pointer; padding: 13px 0; font-weight: 600; font-size: 14.5px; list-style: none; display: flex; justify-content: space-between; gap: 10px; }
details.more summary::-webkit-details-marker { display: none; }
details.more summary::after { content: "+"; color: var(--muted); font-weight: 400; }
details.more[open] summary::after { content: "−"; }
details.more > div { padding-bottom: 14px; display: grid; gap: 10px; color: var(--text-2); font-size: 14px; }
details.more ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
.formula { margin: 0; font-family: var(--mono); font-size: 13px; background: var(--surface-2); border-radius: 8px; padding: 10px 12px; color: var(--text); overflow-x: auto; }
.check { display: grid; grid-template-columns: 18px 1fr; gap: 8px; }
.check i { font-style: normal; color: var(--pos); font-weight: 700; }
.check.warn i { color: var(--warn); }
.quote { background: var(--surface-2); border-left: 3px solid var(--border-strong); border-radius: 8px; padding: 10px 12px; font-size: 14px; color: var(--text-2); }
.quote b { color: var(--text); display: block; font-size: 12.5px; margin-bottom: 4px; }

/* demo */
.demo-panel { border-color: var(--demo); }
.demo-banner { display: flex; gap: 10px; align-items: flex-start; background: var(--demo-soft); border: 1px solid var(--demo); color: var(--text); border-radius: 12px; padding: 10px 12px; font-size: 13.5px; }
.demo-banner b { color: var(--demo); white-space: nowrap; }
.dflow { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); gap: 8px; }
.dflow > div { background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 5px; font-size: 13px; color: var(--text-2); min-width: 0; }
.dflow > div b { color: var(--text); font-size: 13.5px; }
.status { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; align-self: flex-start; }
.status.Supported { background: rgba(52,211,153,.15); color: var(--pos); }
.status.Contradicted { background: rgba(248,113,113,.15); color: var(--neg); }
.status.Insufficient { background: var(--surface-3); color: var(--text-2); }

footer { color: var(--muted); font-size: 12.5px; border-top: 1px solid var(--border); }
footer .wrap { padding-block: 16px 26px; display: flex; flex-wrap: wrap; gap: 6px 18px; justify-content: space-between; }
.err { color: var(--neg); }
/* Signal Value-Added tab: a five-step story; neutral colours for results (nothing here is a "success") */
.sva-steps { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.sva-steps li { display: flex; align-items: center; gap: 6px; }
.sva-steps li + li::before { content: ""; width: 12px; height: 1px; background: var(--border-strong); }
.sva-steps button { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--border); background: var(--surface); color: var(--text-2);
  border-radius: 999px; padding: 4px 12px 4px 4px; font: 600 13px/1.2 var(--font); cursor: pointer; }
.sva-steps button:hover { border-color: var(--border-strong); color: var(--text); }
.sva-steps .n, .sva-eyebrow .n { width: 22px; height: 22px; border-radius: 50%; display: inline-grid; place-items: center; background: var(--accent-soft); color: var(--accent); font-size: 12px; font-weight: 700; flex: none; }
.sva-eyebrow { display: flex; align-items: center; gap: 8px; color: var(--accent); font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }
.sva .panel { gap: 14px; padding: 20px; scroll-margin-top: 84px; }
.sva-split { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 20px; align-items: center; }
.sva-stats { display: grid; gap: 10px; align-content: center; }
.sva-stat { background: var(--surface-2); border-radius: 12px; padding: 12px 14px; display: grid; gap: 4px; }
.sva-stat .v { font: 700 28px/1.1 var(--font); font-variant-numeric: tabular-nums; letter-spacing: -.02em; color: var(--text); }
.sva-stat .l { color: var(--text-2); font-size: 13px; display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.sva-body { color: var(--text-2); font-size: 14.5px; line-height: 1.55; max-width: 76ch; margin: 0; }
.sva-note { display: grid; grid-template-columns: 20px 1fr; gap: 8px; color: var(--text-2); font-size: 13.5px; margin: 0; }
.sva-note svg.i { width: 17px; height: 17px; margin-top: 1px; color: var(--text-2); }
.sva-principle { display: flex; flex-wrap: wrap; gap: 8px; }
.sva-principle > div { flex: 1 1 150px; border-radius: 12px; padding: 10px 12px; display: grid; gap: 4px; font-size: 12.5px; color: var(--muted); }
.sva-principle b { color: var(--text); font-size: 13.5px; display: flex; gap: 6px; align-items: center; }
.sva-principle svg.i { width: 16px; height: 16px; color: var(--muted); }
.sva-principle .fixed { background: var(--surface-2); border: 1px solid var(--border); }
.sva-principle .switch { border: 1.5px solid var(--accent); background: var(--accent-soft); }
.sva-principle .switch svg.i { color: var(--accent); }
.sva-toggle { justify-self: start; display: inline-flex; border-radius: 999px; overflow: hidden; border: 1px solid var(--accent); font-size: 12px; font-weight: 700; }
.sva-toggle span { padding: 2px 10px; color: var(--accent); }
.sva-toggle .on { background: var(--accent); color: var(--bg); }
.sva-principle-line { margin: 0; font-size: 15px; color: var(--text); }
.sva-exp { border: 1px solid var(--border); border-top: 3px solid var(--c); border-radius: 12px; padding: 14px; display: grid; gap: 11px; align-content: start; min-width: 0; background: var(--surface); }
.sva-exp-h { display: grid; gap: 4px; }
.sva-tag { color: var(--muted); font-size: 11.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }
.sva-vs { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 13px; }
.sva-vs .pill { border-radius: 999px; padding: 3px 10px; font-weight: 600; border: 1.5px solid var(--c); color: var(--text); }
.sva-vs .pill.off { border-style: dashed; border-color: var(--c-bench); color: var(--text-2); }
.sva-vs .x { color: var(--muted); font-size: 12px; }
.mixbar { display: flex; height: 12px; border-radius: 6px; overflow: hidden; gap: 2px; border: 1px solid var(--border); }
.mixbar span { display: block; }
.mixlegend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--text-2); }
.mixlegend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; border: 1px solid var(--border-strong); }
.sva-setup { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; font-size: 13.5px; color: var(--text-2); }
.sva-setup li { display: grid; grid-template-columns: 20px 1fr; gap: 8px; align-items: start; }
.sva-setup svg.i { width: 16px; height: 16px; margin-top: 1px; color: var(--muted); }
.sva-setup li.only { color: var(--text); font-weight: 600; }
.sva-setup li.only svg.i { color: var(--c); }
.sva-q { margin: 0; font-weight: 650; font-size: 14.5px; line-height: 1.45; color: var(--text); border-left: 3px solid var(--c); padding-left: 10px; }
.cerbars { display: grid; gap: 7px; }
.cerbar { display: grid; grid-template-columns: 104px minmax(0, 1fr) 54px; gap: 10px; align-items: center; font-size: 13px; color: var(--text-2); }
.cerbar .t { height: 14px; background: var(--surface-2); border-radius: 5px; position: relative; overflow: hidden; }
.cerbar .t span { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 5px; }
.cerbar .t span.off { opacity: .75; background-image: repeating-linear-gradient(135deg, transparent 0 5px, rgba(0,0,0,.18) 5px 8px) !important; }
.cerbar b { text-align: right; color: var(--text); font-variant-numeric: tabular-nums; }
.sva-delta { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.sva-delta .big { font: 700 28px/1.1 var(--font); letter-spacing: -.02em; color: var(--text); }
.sva-take { margin: 0; font-size: 13.5px; color: var(--text); }
.chartbox.xs { height: 170px; }
.gapbar { display: flex; height: 26px; border-radius: 8px; overflow: hidden; }
.gapbar span { display: block; height: 100%; }
.gapbar span + span { box-shadow: inset 3px 0 0 var(--surface); }
.gaplegend { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 10px 18px; font-size: 13.5px; color: var(--text-2); }
.gaplegend > div { display: grid; grid-template-columns: 14px 1fr; gap: 8px; align-items: start; }
.gaplegend i { width: 14px; height: 14px; border-radius: 4px; margin-top: 2px; }
.gaplegend b { color: var(--text); font-size: 15px; margin-right: 4px; }
.gaplegend small { display: block; color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.gaplegend .tot { grid-template-columns: 1fr; border-left: 2px solid var(--border-strong); padding-left: 10px; }
.sva-label { margin: 0; font-size: 13.5px; color: var(--text); font-weight: 600; }
.sva-list { margin: 0; padding-left: 18px; display: grid; gap: 6px; font-size: 13.5px; color: var(--text-2); }
.sva-caution { display: grid; grid-template-columns: 20px 1fr; gap: 8px; background: var(--surface-2); border-left: 3px solid var(--warn); border-radius: 10px; padding: 10px 12px; font-size: 13.5px; color: var(--text-2); margin: 0; }
.sva-caution svg.i { width: 17px; height: 17px; color: var(--warn); margin-top: 1px; }
.sva-final { border-color: var(--border-strong); }
.sva-quote { font-size: clamp(17px, 2.1vw, 21px); font-weight: 650; line-height: 1.4; margin: 0; max-width: 62ch; color: var(--text); text-wrap: balance; }
.sva-limits { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 8px 18px; font-size: 13.5px; color: var(--text-2); }
.sva-limits li { display: grid; grid-template-columns: 20px 1fr; gap: 8px; align-items: start; }
.sva-limits svg.i { width: 16px; height: 16px; color: var(--muted); margin-top: 1px; }

/* ---- Causal RAG stage detail and exploratory marking ---- */
.rlane.explor { border-style: dashed; border-top-style: solid; }
.rlane.explor .rl-badge { background: var(--warn); color: var(--bg); }
.xmark { margin-left: 7px; font-size: 10.5px; font-weight: 600; letter-spacing: .02em; white-space: nowrap;
  color: var(--muted); background: var(--surface-2); border: 1px solid var(--border); border-radius: 999px; padding: 1px 7px;
  text-transform: none; vertical-align: middle; display: inline-flex; align-items: center; gap: 4px; }
.xmark .tip > button { width: 14px; height: 14px; font-size: 9px; }
tr.xrow td, tr.xrow th { background: transparent; }
.evlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; }
.evlist li { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; background: var(--surface-2);
  border-radius: 8px; padding: 7px 10px; font-size: 12.5px; color: var(--text-2); }
.evlist b { color: var(--text); font-size: 13px; }
.evlist em { margin-left: auto; font-style: normal; color: var(--text); font-weight: 650; }
.stbar { display: flex; height: 34px; border-radius: 9px; overflow: hidden; }
.stbar span { display: grid; place-items: center; min-width: 0; overflow: hidden; font-size: 10.5px; color: var(--bg); padding: 0 4px; text-align: center; }
.stbar b { display: block; font-size: 14px; font-weight: 700; }
.stbar .st-ok { background: var(--pos); } .stbar .st-neg { background: var(--neg); } .stbar .st-mut { background: var(--slate); }
.hyps { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; }
.hyps li { border-radius: 10px; padding: 9px 11px; background: var(--surface-2); border-left: 3px solid var(--slate); display: grid; gap: 4px; }
.hyps li.s-ok { border-left-color: var(--pos); } .hyps li.s-neg { border-left-color: var(--neg); }
.hh { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; }

.rlanes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; align-items: start; }

  border-radius: 8px; padding: 4px 9px; font: 700 10.5px/1 var(--font); letter-spacing: .02em; }

  border-radius: 9px; padding: 7px 9px; background: var(--surface-2); font-size: 12.5px; color: var(--text-2);
  border-left: 2px solid transparent; transition: background .28s ease, border-color .28s ease, opacity .28s ease; }

.rl-stages .n { width: 20px; height: 20px; border-radius: 50%; display: inline-grid; place-items: center;
  background: var(--surface-3); font-size: 10.5px; font-weight: 700; align-self: center; }

.rl-stages .t { color: var(--muted); font-size: 11.5px; }

  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.rl-out { display: grid; gap: 9px; border-top: 1px solid var(--border); padding-top: 10px; }

@media (max-width: 1000px) { .rlanes { grid-template-columns: 1fr; } }

/* ---- redesign: header download, overview, pipeline, appendix ---- */

  border-radius: 10px; padding: 7px 10px; }

  background: var(--surface-2); border-radius: 9px; padding: 8px 11px; font-size: 13px; color: var(--text-2); }

.srcs { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; font-size: 13px; color: var(--text-2); }

/* appendix */

.fas-funnel li { position: relative; display: flex; justify-content: space-between; align-items: baseline; gap: 10px;
  background: var(--surface-2); border-radius: 8px; padding: 7px 10px; font-size: 12.5px; color: var(--text-2); }
.fas-funnel li .num { color: var(--text); font-weight: 650; font-variant-numeric: tabular-nums; white-space: nowrap; }
.fas-funnel li i { position: absolute; left: 50%; bottom: -6px; transform: translateX(-50%); width: 9px; height: 5px;
  background: var(--border-strong); clip-path: polygon(0 0, 100% 0, 50% 100%); }
.fas-keep { display: grid; grid-template-columns: 1fr 1fr auto; gap: 4px 9px; align-items: center; font-size: 12px; color: var(--muted); }

#sva-transmission, #sva-response, #sva-where, #sva-similarity, #sva-transmission-read, #sva-transmission-rag
  { grid-template-columns: minmax(0, 1fr); }
.sva-read { list-style: none; margin: 0; padding: 0; display: grid; gap: 9px; min-width: 0; }

.fas-tbl { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; min-width: 0; }

.rp .grid2 > .panel { grid-template-columns: minmax(0, 1fr); }

.fas-tbl h3 .sub { font-weight: 500; }
.fas-tbl table tbody tr.now { background: var(--accent-soft); }
.fas-tbl table tbody tr.now th { font-weight: 700; color: var(--text); }
.fas-corr { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.fas-cc { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 13px 14px; display: grid; gap: 3px; align-content: start; }
.fas-cc.hi { border-color: var(--accent); background: var(--accent-soft); }
.fas-cc .v { font: 700 27px/1.1 var(--font); letter-spacing: -.02em; color: var(--text); font-variant-numeric: tabular-nums; }

@media (max-width: 820px) {

.rules { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); gap: 8px 16px; }
