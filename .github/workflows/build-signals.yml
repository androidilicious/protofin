name: Build signals

on:
  schedule:
    - cron: "30 22 * * 1-5"      # weekdays 22:30 UTC, after the US close
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "site/data/signals.json"

permissions:
  contents: write

concurrency:
  group: signals
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies (CPU torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Build signals.json (and a reference run when a key is configured)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'gpt-4o' }}
        run: |
          python scripts/build_signals.py --reference
          cp docs/protofin-pipeline.html site/protofin-pipeline.html
      - name: Commit refreshed signals
        run: |
          git config user.name "protofin-bot"
          git config user.email "protofin-bot@users.noreply.github.com"
          git add site/data/signals.json site/protofin-pipeline.html data/news/fomc_index.csv
          git diff --cached --quiet || git commit -m "signals: $(date -u +%F)"
          git push
      # Deployment to Cloudflare Pages is done from a laptop with `deploy.cmd` (wrangler login), so
      # this workflow needs no Cloudflare credentials. It only keeps the repo's signals file current.
