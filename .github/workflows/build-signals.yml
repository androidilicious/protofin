name: Build signals

on:
  schedule:
    - cron: "30 22 * * 1-5"      # weekdays 22:30 UTC, after the US close
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "site/data/signals.json"

permissions:
  contents: write

concurrency:
  group: signals
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies (CPU torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Build signals.json (and a reference run when a key is configured)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'gpt-4o' }}
        run: |
          python scripts/build_signals.py --reference
          cp docs/protofin-pipeline.html site/protofin-pipeline.html
      - name: Commit refreshed signals
        run: |
          git config user.name "protofin-bot"
          git config user.email "protofin-bot@users.noreply.github.com"
          git add site/data/signals.json site/protofin-pipeline.html data/news/fomc_index.csv
          git diff --cached --quiet || git commit -m "signals: $(date -u +%F)"
          git push
      # Redeploy to Cloudflare Pages when an API token is configured (project created by direct upload).
      # Alternative: connect the repo under Workers & Pages -> protofin -> Settings -> Builds, then this
      # step is unnecessary and can stay skipped.
      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx --yes wrangler@4 pages deploy site --project-name protofin --branch main --commit-dirty=true
