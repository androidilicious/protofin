name: Build signals

on:
  schedule:
    - cron: "30 22 * * 1-5"      # weekdays 22:30 UTC, after the US close
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "site/data/signals.json"
      - "site/data/harness.json"
      - "data/store/**"

permissions:
  contents: write

concurrency:
  group: signals
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # true only when the repository has a Cloudflare token; the publish step is skipped otherwise
      CAN_PUBLISH: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies (CPU torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Build signals.json (and a reference run when a key is configured)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'gpt-4o' }}
        run: |
          python scripts/build_signals.py --reference
          cp docs/protofin-pipeline.html site/protofin-pipeline.html
      - name: Run the signal harness (store every reading, score the alert)
        continue-on-error: true     # a broken source must not stop the existing signals build
        run: python -m harness.run
      - name: Commit refreshed signals
        run: |
          git config user.name "protofin-bot"
          git config user.email "protofin-bot@users.noreply.github.com"
          git add site/data/signals.json site/protofin-pipeline.html data/news/fomc_index.csv
          if [ -d data/store ]; then git add data/store; fi
          if [ -f site/data/harness.json ]; then git add site/data/harness.json; fi
          git diff --cached --quiet || git commit -m "signals: $(date -u +%F)"
          git push
      - name: Publish the site to Cloudflare Pages
        if: env.CAN_PUBLISH == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python scripts/stamp_site.py
          npx --yes wrangler@4 pages deploy site --project-name protofin --branch main --commit-dirty=true
      # Publishing needs two repository secrets: CLOUDFLARE_API_TOKEN (an API token with the
      # "Cloudflare Pages: Edit" permission) and CLOUDFLARE_ACCOUNT_ID. Without them this step is
      # skipped and the site is published from a laptop with `deploy.cmd`, as before.
